<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Notebook Memory recorded demo</title><style>body{max-width:900px;margin:40px auto;padding:20px;background:#101923;color:#ddeaf6;font:18px system-ui}button{padding:12px;font:inherit}pre{white-space:pre-wrap;background:#07111b;padding:24px;font:15px/1.5 monospace}a{color:#8fd9ff}</style><h1>Notebook Memory: recorded walkthrough</h1><p>Actual DKG 10.0.18 HTTP calls and storage. Mock blockchain; no SHARE or PUBLISH. Reading pauses added.</p><button id="play">Play / restart (30 seconds)</button> <button id="all">Show full transcript</button><pre id="screen" aria-live="polite">Press Play to view the recording.</pre><p><a href="https://github.com/Codesensitive/dkg-notebook-memory">Source and reproduction instructions</a></p><script>const events=[[0,"o","DKG Notebook Memory — live HTTP walkthrough\r\nReal DKG 10.0.18; mock blockchain; no SHARE or PUBLISH.\r\nReading pauses added to this terminal recording.\r\n\r\n"],[6,"o","{\r\n  \"step\": \"1. Plan selected notebook cells\",\r\n  \"selected\": [\r\n    \"hypothesis\",\r\n    \"experiment\"\r\n  ],\r\n  \"excluded\": \"Unmarked scratch cell, all outputs and attachments\"\r\n}\r\n\r\n"],[12,"o","{\r\n  \"step\": \"2. Push and verify readback\",\r\n  \"results\": [\r\n    {\r\n      \"cell\": \"hypothesis\",\r\n      \"status\": \"written\",\r\n      \"verified\": true\r\n    },\r\n    {\r\n      \"cell\": \"experiment\",\r\n      \"status\": \"written\",\r\n      \"verified\": true\r\n    }\r\n  ]\r\n}\r\n\r\n"],[18,"o","{\r\n  \"step\": \"3. Recall in a later agent step\",\r\n  \"source\": \"https://example.org/research/demo#cell-hypothesis\",\r\n  \"finding\": \"## Hypothesis\\nCaching repeated deterministic calculations should reduce repeated-run latency. This is a testable hypothesis, not a measured result.\"\r\n}\r\n\r\n"],[24,"o","{\r\n  \"step\": \"4. Repeat safely\",\r\n  \"results\": [\r\n    {\r\n      \"cell\": \"hypothesis\",\r\n      \"status\": \"already-present\"\r\n    },\r\n    {\r\n      \"cell\": \"experiment\",\r\n      \"status\": \"already-present\"\r\n    }\r\n  ]\r\n}\r\n\r\n"],[30,"o","Completed: selected findings stored and recalled.\r\nThis recording demonstrates functionality, not a bounty award.\r\n\r\n"]];let timers=[];const screen=document.getElementById('screen');function reset(){timers.forEach(clearTimeout);timers=[];screen.textContent=''}document.getElementById('play').onclick=()=>{reset();for(const [t,type,text] of events)timers.push(setTimeout(()=>{screen.textContent+=text},t*1000))};document.getElementById('all').onclick=()=>{reset();screen.textContent=events.map(e=>e[2]).join('')};</script></html>
